<!DOCTYPE html><html><head><meta charset="utf-8"><title>pin</title>
<style>html,body{margin:0;padding:0;background:#fff;overflow:hidden}
img{display:block;margin:0;position:absolute;top:0;left:0}</style></head>
<body><img id="p" alt="pin">
<script>
var q=new URLSearchParams(location.search);
var img=document.getElementById('p');
img.src='img/'+q.get('slug')+'/'+q.get('layout')+'.jpg';
function fit(){var h=window.innerHeight;img.style.height=h+'px';img.style.width=Math.round(h*2/3)+'px';}
img.onload=fit;window.addEventListener('resize',fit);fit();
</script></body></html>
